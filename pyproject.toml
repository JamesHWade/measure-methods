[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "measure-methods"
version = "0.1.0.dev0"
description = "Pure-Python numerical kernels for analytical method resource accounting"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "James Wade" }]
dependencies = []

[project.optional-dependencies]
dev = [
  "build>=1.3,<2",
  "pytest>=8,<10",
  "ruff>=0.14,<0.15",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[project.urls]
Repository = "https://github.com/JamesHWade/measure-methods"
Issues = "https://github.com/JamesHWade/measure-methods/issues"
