name: Checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: backend-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install development tools
        run: >-
          python -m pip install
          "build>=1.3,<2"
          "pytest>=8,<10"
          "ruff>=0.14,<0.15"
      - name: Lint and format check
        run: |
          python -m ruff check .
          python -m ruff format --check .
      - name: Build wheel and source distribution
        run: python -m build
      - name: Test installed wheel from outside the checkout
        env:
          CHECKOUT: ${{ github.workspace }}
        run: |
          python -m pip install --no-deps dist/*.whl
          scratch="$(mktemp -d)"
          (cd "$scratch" && python -m pytest "$CHECKOUT/tests")
      - name: Test installed source distribution from outside the checkout
        env:
          CHECKOUT: ${{ github.workspace }}
        run: |
          python -m pip uninstall -y measure-methods
          python -m pip install --no-deps dist/*.tar.gz
          scratch="$(mktemp -d)"
          (cd "$scratch" && python -m pytest "$CHECKOUT/tests")
